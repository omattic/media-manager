[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-manager"
version = "0.1.0"
description = "Photo and video inventory, backup verification, and safe deletion CLI."
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Carlos Guerrero" }
]

[project.scripts]
media-manager = "media_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
